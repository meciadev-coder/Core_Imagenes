<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Core Reserva Salas</title>

<!-- ICONO E IDENTIDAD PWA — esto SÍ lo lee iOS porque es el documento de nivel superior -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Core Salas">
<meta name="theme-color" content="#8E4A7E">

<style>
  html, body { margin:0; padding:0; height:100%; background:#8E4A7E; overflow:hidden; }
  /* Capa de carga con el morado de marca mientras arranca Apps Script */
  #splash {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#8E4A7E; z-index:2; transition:opacity .4s; font-family:-apple-system,sans-serif;
  }
  #splash img { width:96px; height:96px; }
  #app-frame {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; background:#FAF7F5;
  }
</style>
</head>
<body>
  <div id="splash"><img src="apple-touch-icon-180.png" alt="Core"></div>

  <!-- La app real de Apps Script, a pantalla completa. Login y datos siguen igual. -->
  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbzuxVwYDGDTBcauvrtxaqrAOyketHaLHba1t858Z6CWACn9WcNk8HoGrDESB1QS25UQ/exec"
          allow="clipboard-write"
          onload="document.getElementById('splash').style.opacity='0';
                  setTimeout(function(){var s=document.getElementById('splash'); if(s) s.style.display='none';}, 400);">
  </iframe>
</body>
</html>
